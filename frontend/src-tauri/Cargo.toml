[package]
name = "tredalix-ai-desktop"
version = "0.1.0"
description = "TREDALIX AI Windows desktop application"
authors = ["TREDALIX AI"]
edition = "2024"

[lib]
name = "tredalix_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tredalix_ai = { package = "TREDALIX_AI", path = "../.." }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
] }
